name: Gitleaks Scan

description: >
  Scans the source repository for hardcoded secrets using the
  organization's Gitleaks policy and generates a SARIF report
  for downstream workflow jobs.

author: Microbank Platform Team

inputs:
  working-directory:
    description: Repository root directory.
    required: false
    default: "."

  config-path:
    description: >
      Optional path to a custom Gitleaks configuration file.
      If omitted, the enterprise policy bundled with the platform
      repository will be used.
    required: false
    default: ""

  report-directory:
    description: Directory where the Gitleaks report will be generated.
    required: false
    default: ".github/reports"

  report-format:
    description: Gitleaks report format.
    required: false
    default: "sarif"

outputs:
  report-file:
    description: Generated Gitleaks report.
    value: ${{ steps.report.outputs.report-file }}

runs:
  using: composite
  steps:
    - name: Validate Gitleaks CLI
      shell: bash
      run: |
        set -euo pipefail

        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "::error::Gitleaks CLI is not available on the runner."
          echo "::error::The calling workflow must install the approved Gitleaks version."
          exit 1
        fi

        echo "Gitleaks version:"
        gitleaks version

    - name: Resolve Gitleaks Configuration
      id: config
      shell: bash
      env:
        CONFIG_PATH_INPUT: ${{ inputs.config-path }}
      run: |
        set -euo pipefail

        if [[ -n "$CONFIG_PATH_INPUT" ]]; then
          CONFIG_PATH="$CONFIG_PATH_INPUT"
        else
          CONFIG_PATH="${GITHUB_ACTION_PATH}/../../policies/secrets/.gitleaks.toml"
        fi

        if [[ ! -f "$CONFIG_PATH" ]]; then
          echo "::error::Gitleaks configuration not found: $CONFIG_PATH"
          exit 1
        fi

        echo "config-path=$CONFIG_PATH" >> "$GITHUB_OUTPUT"

    - name: Validate Repository Directory
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        if [[ ! -d "$WORKING_DIRECTORY" ]]; then
          echo "::error::Gitleaks working directory does not exist: $WORKING_DIRECTORY"
          exit 1
        fi

    - name: Validate Report Format
      shell: bash
      env:
        REPORT_FORMAT: ${{ inputs.report-format }}
      run: |
        set -euo pipefail

        case "$REPORT_FORMAT" in
          sarif|json|csv|junit|template)
            ;;
          *)
            echo "::error::Unsupported Gitleaks report format: $REPORT_FORMAT"
            echo "::error::Supported formats: sarif, json, csv, junit, template."
            exit 1
            ;;
        esac

    - name: Prepare Report Directory
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REPORT_DIRECTORY: ${{ inputs.report-directory }}
      run: |
        set -euo pipefail

        mkdir -p "$REPORT_DIRECTORY"

    - name: Execute Gitleaks Scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONFIG_PATH: ${{ steps.config.outputs.config-path }}
        REPORT_DIRECTORY: ${{ inputs.report-directory }}
        REPORT_FORMAT: ${{ inputs.report-format }}
      run: |
        set -euo pipefail

        REPORT_FILE="${REPORT_DIRECTORY}/gitleaks.${REPORT_FORMAT}"

        gitleaks detect \
          --source . \
          --config "$CONFIG_PATH" \
          --report-format "$REPORT_FORMAT" \
          --report-path "$REPORT_FILE" \
          --redact

    - name: Verify Generated Report
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REPORT_DIRECTORY: ${{ inputs.report-directory }}
        REPORT_FORMAT: ${{ inputs.report-format }}
      run: |
        set -euo pipefail

        REPORT_FILE="${PWD}/${REPORT_DIRECTORY}/gitleaks.${REPORT_FORMAT}"

        if [[ ! -f "$REPORT_FILE" ]]; then
          echo "::error::Gitleaks report was not generated: $REPORT_FILE"
          exit 1
        fi

        if [[ ! -s "$REPORT_FILE" ]]; then
          echo "::error::Gitleaks report is empty: $REPORT_FILE"
          exit 1
        fi

    - name: Expose Report Location
      id: report
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REPORT_DIRECTORY: ${{ inputs.report-directory }}
        REPORT_FORMAT: ${{ inputs.report-format }}
      run: |
        set -euo pipefail

        REPORT_FILE="${PWD}/${REPORT_DIRECTORY}/gitleaks.${REPORT_FORMAT}"

        echo "report-file=$REPORT_FILE" >> "$GITHUB_OUTPUT"