name: Checkmarx SAST

description: >
  Runs a Checkmarx One SAST scan against the application source code,
  enforces the organization-defined SAST security threshold, generates
  a SARIF report, and exposes the scan result for downstream workflows.

author: Microbank Platform Team

inputs:
  project-name:
    description: >
      Checkmarx One project name. If omitted, the GitHub repository
      name is used.
    required: false
    default: ""

  branch:
    description: >
      Checkmarx One project branch. If omitted, the pull request head
      branch or current GitHub reference is used.
    required: false
    default: ""

  base-uri:
    description: Checkmarx One base URI.
    required: true

  tenant:
    description: Checkmarx One tenant name.
    required: true

  source-directory:
    description: Directory containing the source code to scan.
    required: false
    default: "."

  sast-threshold:
    description: >
      SAST threshold that fails the scan when the configured vulnerability
      count is reached. Example: sast-critical=1;sast-high=1
    required: false
    default: "sast-critical=1;sast-high=1"

  incremental:
    description: Whether to request an incremental SAST scan.
    required: false
    default: "false"

  generate-sarif:
    description: Whether to generate a SARIF report.
    required: false
    default: "true"

  report-directory:
    description: Directory where the SARIF report is generated.
    required: false
    default: ".github/reports"

  additional-scan-params:
    description: >
      Additional Checkmarx One scan parameters approved by the
      organization.
    required: false
    default: ""

outputs:
  scan-id:
    description: Checkmarx One scan ID.
    value: ${{ steps.checkmarx.outputs.cxScanID }}

  sarif-file:
    description: Path to the generated Checkmarx SARIF report.
    value: ${{ steps.report.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Validate Checkmarx Configuration
      shell: bash
      env:
        CX_BASE_URI: ${{ inputs.base-uri }}
        CX_TENANT: ${{ inputs.tenant }}
        CX_CLIENT_ID: ${{ env.CX_CLIENT_ID }}
        CX_CLIENT_SECRET: ${{ env.CX_CLIENT_SECRET }}
      run: |
        set -euo pipefail

        if [[ -z "$CX_BASE_URI" ]]; then
          echo "::error::Checkmarx base URI is not configured."
          exit 1
        fi

        if [[ -z "$CX_TENANT" ]]; then
          echo "::error::Checkmarx tenant is not configured."
          exit 1
        fi

        if [[ -z "$CX_CLIENT_ID" ]]; then
          echo "::error::CX_CLIENT_ID is not configured."
          exit 1
        fi

        if [[ -z "$CX_CLIENT_SECRET" ]]; then
          echo "::error::CX_CLIENT_SECRET is not configured."
          exit 1
        fi

    - name: Validate Source Directory
      shell: bash
      env:
        SOURCE_DIRECTORY: ${{ inputs.source-directory }}
      run: |
        set -euo pipefail

        if [[ ! -d "$SOURCE_DIRECTORY" ]]; then
          echo "::error::Checkmarx source directory does not exist: $SOURCE_DIRECTORY"
          exit 1
        fi

    - name: Prepare Report Directory
      if: inputs.generate-sarif == 'true'
      shell: bash
      env:
        SOURCE_DIRECTORY: ${{ inputs.source-directory }}
        REPORT_DIRECTORY: ${{ inputs.report-directory }}
      run: |
        set -euo pipefail

        REPORT_PATH="${SOURCE_DIRECTORY}/${REPORT_DIRECTORY}"

        mkdir -p "$REPORT_PATH"

    - name: Resolve Project and Branch
      id: context
      shell: bash
      env:
        PROJECT_NAME_INPUT: ${{ inputs.project-name }}
        BRANCH_INPUT: ${{ inputs.branch }}
      run: |
        set -euo pipefail

        if [[ -n "$PROJECT_NAME_INPUT" ]]; then
          PROJECT_NAME="$PROJECT_NAME_INPUT"
        else
          PROJECT_NAME="${GITHUB_REPOSITORY}"
        fi

        if [[ -n "$BRANCH_INPUT" ]]; then
          BRANCH="$BRANCH_INPUT"
        elif [[ -n "${GITHUB_HEAD_REF:-}" ]]; then
          BRANCH="${GITHUB_HEAD_REF}"
        else
          BRANCH="${GITHUB_REF_NAME}"
        fi

        if [[ -z "$PROJECT_NAME" ]]; then
          echo "::error::Checkmarx project name could not be resolved."
          exit 1
        fi

        if [[ -z "$BRANCH" ]]; then
          echo "::error::Checkmarx branch could not be resolved."
          exit 1
        fi

        echo "project-name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
        echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

    - name: Run Checkmarx One SAST
      id: checkmarx
      uses: Checkmarx/ast-github-action@main
      with:
        base_uri: ${{ inputs.base-uri }}
        cx_tenant: ${{ inputs.tenant }}
        cx_client_id: ${{ env.CX_CLIENT_ID }}
        cx_client_secret: ${{ env.CX_CLIENT_SECRET }}

        project_name: ${{ steps.context.outputs.project-name }}
        branch: ${{ steps.context.outputs.branch }}

        github_token: ${{ github.token }}

        source_dir: ${{ inputs.source-directory }}

        scan_params: >-
          --scan-types sast
          --threshold "${{ inputs.sast-threshold }}"
          ${{ inputs.incremental == 'true' && '--sast-incremental' || '' }}
          ${{ inputs.generate-sarif == 'true'
              && format('--report-format sarif --output-path {0}/{1}',
                        inputs.source-directory,
                        inputs.report-directory)
              || '' }}
          ${{ inputs.additional-scan-params }}

    - name: Verify SARIF Report
      if: inputs.generate-sarif == 'true'
      shell: bash
      working-directory: ${{ inputs.source-directory }}
      env:
        SOURCE_DIRECTORY: ${{ inputs.source-directory }}
        REPORT_DIRECTORY: ${{ inputs.report-directory }}
      run: |
        set -euo pipefail

        SARIF_FILE="${SOURCE_DIRECTORY}/${REPORT_DIRECTORY}/cx_result.sarif"

        if [[ ! -f "$SARIF_FILE" ]]; then
          echo "::error::Checkmarx SARIF report was not generated: $SARIF_FILE"
          exit 1
        fi

        if [[ ! -s "$SARIF_FILE" ]]; then
          echo "::error::Checkmarx SARIF report is empty: $SARIF_FILE"
          exit 1
        fi

    - name: Expose Report Location
      if: inputs.generate-sarif == 'true'
      id: report
      shell: bash
      working-directory: ${{ inputs.source-directory }}
      env:
        SOURCE_DIRECTORY: ${{ inputs.source-directory }}
        REPORT_DIRECTORY: ${{ inputs.report-directory }}
      run: |
        set -euo pipefail

        SARIF_FILE="${SOURCE_DIRECTORY}/${REPORT_DIRECTORY}/cx_result.sarif"

        echo "sarif-file=${GITHUB_WORKSPACE}/${SARIF_FILE}" >> "$GITHUB_OUTPUT"