name: Download Build Artifact

description: >
  Downloads a previously uploaded GitHub Actions artifact for
  downstream workflow jobs.

author: Microbank Platform Team

inputs:
  artifact-name:
    description: Artifact name.
    required: true

  destination-path:
    description: Download destination.
    required: false
    default: "artifacts"

runs:
  using: composite
  steps:
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.destination-path }}

    - name: Verify Download
      shell: bash
      env:
        DESTINATION_PATH: ${{ inputs.destination-path }}
      run: |
        set -euo pipefail

        if [[ ! -d "$DESTINATION_PATH" ]]; then
          echo "::error::Artifact download directory was not created: $DESTINATION_PATH"
          exit 1
        fi

        mapfile -t FILES < <(
          find "$DESTINATION_PATH" \
            -type f \
            -print
        )

        if [[ "${#FILES[@]}" -eq 0 ]]; then
          echo "::error::Downloaded artifact is empty: $DESTINATION_PATH"
          exit 1
        fi

        echo "Downloaded artifact contents:"
        printf '%s\n' "${FILES[@]}"