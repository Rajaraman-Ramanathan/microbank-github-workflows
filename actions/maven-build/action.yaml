name: Maven Build

description: >
  Builds a Java application using the Maven Wrapper and produces an
  executable JAR for downstream workflow jobs.

author: Microbank Platform Team

inputs:
  working-directory:
    description: Maven project root directory.
    required: false
    default: "."

  goals:
    description: Maven goals to execute.
    required: false
    default: "clean package"

  additional-args:
    description: Additional Maven command line arguments.
    required: false
    default: ""

outputs:
  group-id:
    description: Maven groupId.
    value: ${{ steps.project-metadata.outputs.group-id }}

  artifact-id:
    description: Maven artifactId.
    value: ${{ steps.project-metadata.outputs.artifact-id }}

  project-version:
    description: Maven project version.
    value: ${{ steps.project-metadata.outputs.project-version }}

  artifact-file:
    description: Executable JAR filename.
    value: ${{ steps.locate-jar.outputs.artifact-file }}

  artifact-path:
    description: Executable JAR path.
    value: ${{ steps.locate-jar.outputs.artifact-path }}

runs:
  using: composite

  steps:

    - name: Validate Maven Project
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        if [[ ! -f "pom.xml" ]]; then
          echo "::error::pom.xml not found: ${PWD}/pom.xml"
          exit 1
        fi

        if [[ ! -f "mvnw" ]]; then
          echo "::error::Maven Wrapper not found: ${PWD}/mvnw"
          exit 1
        fi

        if [[ ! -f ".mvn/wrapper/maven-wrapper.properties" ]]; then
          echo "::error::Maven Wrapper configuration not found: ${PWD}/.mvn/wrapper/maven-wrapper.properties"
          exit 1
        fi

        if ! command -v java >/dev/null 2>&1; then
          echo "::error::Java runtime is not available on the runner."
          echo "::error::The calling workflow must configure Java before using this action."
          exit 1
        fi

        chmod +x mvnw

        java --version
        ./mvnw --version

    - name: Read Project Metadata
      id: project-metadata
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        GROUP_ID="$(
          ./mvnw help:evaluate \
            -Dexpression=project.groupId \
            -q \
            -DforceStdout
        )"

        ARTIFACT_ID="$(
          ./mvnw help:evaluate \
            -Dexpression=project.artifactId \
            -q \
            -DforceStdout
        )"

        VERSION="$(
          ./mvnw help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout
        )"

        if [[ -z "$GROUP_ID" ]]; then
          echo "::error::Maven project groupId could not be determined."
          exit 1
        fi

        if [[ -z "$ARTIFACT_ID" ]]; then
          echo "::error::Maven project artifactId could not be determined."
          exit 1
        fi

        if [[ -z "$VERSION" ]]; then
          echo "::error::Maven project version could not be determined."
          exit 1
        fi

        echo "group-id=$GROUP_ID" >> "$GITHUB_OUTPUT"
        echo "artifact-id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
        echo "project-version=$VERSION" >> "$GITHUB_OUTPUT"

        echo "Maven groupId: $GROUP_ID"
        echo "Maven artifactId: $ARTIFACT_ID"
        echo "Maven version: $VERSION"

    - name: Build Application
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MAVEN_GOALS: ${{ inputs.goals }}
        MAVEN_ADDITIONAL_ARGS: ${{ inputs.additional-args }}
      run: |
        set -euo pipefail

        read -r -a GOALS <<< "$MAVEN_GOALS"

        MAVEN_ARGS=(
          "${GOALS[@]}"
          "-DskipTests"
        )

        if [[ -n "$MAVEN_ADDITIONAL_ARGS" ]]; then
          read -r -a ADDITIONAL_ARGS <<< "$MAVEN_ADDITIONAL_ARGS"
          MAVEN_ARGS+=("${ADDITIONAL_ARGS[@]}")
        fi

        ./mvnw "${MAVEN_ARGS[@]}"

    - name: Locate Executable JAR
      id: locate-jar
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ARTIFACT_ID: ${{ steps.project-metadata.outputs.artifact-id }}
      run: |
        set -euo pipefail

        if [[ ! -d "target" ]]; then
          echo "::error::Maven target directory was not generated."
          exit 1
        fi

        mapfile -t JARS < <(
          find target \
            -maxdepth 1 \
            -type f \
            -name "${ARTIFACT_ID}-*.jar" \
            ! -name "*.original" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -print
        )

        if [[ "${#JARS[@]}" -eq 0 ]]; then
          echo "::error::Executable JAR not found for Maven artifact: ${ARTIFACT_ID}"
          exit 1
        fi

        if [[ "${#JARS[@]}" -gt 1 ]]; then
          echo "::error::Multiple executable JAR candidates were found:"
          printf '::error::  %s\n' "${JARS[@]}"
          echo "::error::The Maven build must produce exactly one executable JAR."
          exit 1
        fi

        JAR="${JARS[0]}"

        if [[ ! -s "$JAR" ]]; then
          echo "::error::Executable JAR is empty: $JAR"
          exit 1
        fi

        ARTIFACT_PATH="$(realpath "$JAR")"
        ARTIFACT_FILE="$(basename "$JAR")"

        echo "artifact-file=$ARTIFACT_FILE" >> "$GITHUB_OUTPUT"
        echo "artifact-path=$ARTIFACT_PATH" >> "$GITHUB_OUTPUT"

        echo "Executable JAR: $ARTIFACT_PATH"