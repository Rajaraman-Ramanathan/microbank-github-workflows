name: Container Scan

description: >
  Scans a locally built container image for known vulnerabilities using
  Trivy and enforces the organization's container vulnerability threshold.

author: Microbank Platform Team

inputs:
  image:
    description: Local container image reference to scan.
    required: true

  severity-threshold:
    description: >
      Minimum vulnerability severity that causes the scan to fail.
      Supported values are UNKNOWN, LOW, MEDIUM, HIGH, and CRITICAL.
    required: false
    default: "HIGH,CRITICAL"

  ignore-unfixed:
    description: >
      Whether to exclude vulnerabilities for which no fixed version
      is currently available.
    required: false
    default: "false"

  report-directory:
    description: Directory where the Trivy SARIF report is generated.
    required: false
    default: ".github/reports"

  generate-sarif:
    description: Whether to generate a SARIF report.
    required: false
    default: "true"

  trivy-version:
    description: >
      Trivy GitHub Action version. Pin to an immutable commit SHA
      before production use.
    required: false
    default: "v0.72.0"

  additional-args:
    description: >
      Additional organization-approved Trivy arguments.
    required: false
    default: ""

outputs:
  sarif-file:
    description: Path to the generated Trivy SARIF report.
    value: ${{ steps.report.outputs.sarif-file }}

  scan-result:
    description: Trivy scan result.
    value: ${{ steps.gate.outputs.scan-result }}

runs:
  using: composite

  steps:

    - name: Validate Container Image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail

        if ! command -v docker >/dev/null 2>&1; then
          echo "::error::Docker CLI is not available on the runner."
          exit 1
        fi

        if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
          echo "::error::Container image was not found locally: $IMAGE"
          exit 1
        fi

    - name: Prepare Report Directory
      if: inputs.generate-sarif == 'true'
      shell: bash
      env:
        REPORT_DIRECTORY: ${{ inputs.report-directory }}
      run: |
        set -euo pipefail

        mkdir -p "$REPORT_DIRECTORY"

    - name: Run Trivy Container Scan
      id: scan
      continue-on-error: true
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ inputs.image }}
        format: ${{ inputs.generate-sarif == 'true' && 'sarif' || 'table' }}
        output: ${{ inputs.generate-sarif == 'true' && format('{0}/trivy-container.sarif', inputs.report-directory) || '' }}
        exit-code: "1"
        severity: ${{ inputs.severity-threshold }}
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
        vuln-type: "os,library"
        version: ${{ inputs.trivy-version }}
        cache: "true"
        limit-severities-for-sarif: "true"

    - name: Verify Generated Report
      if: always() && inputs.generate-sarif == 'true'
      id: report
      shell: bash
      env:
        REPORT_DIRECTORY: ${{ inputs.report-directory }}
      run: |
        set -euo pipefail

        REPORT_FILE="${GITHUB_WORKSPACE}/${REPORT_DIRECTORY}/trivy-container.sarif"

        if [[ ! -f "$REPORT_FILE" ]]; then
          echo "::error::Trivy SARIF report was not generated: $REPORT_FILE"
          exit 1
        fi

        if [[ ! -s "$REPORT_FILE" ]]; then
          echo "::error::Trivy SARIF report is empty: $REPORT_FILE"
          exit 1
        fi

        echo "sarif-file=$REPORT_FILE" >> "$GITHUB_OUTPUT"

    - name: Enforce Container Security Gate
      if: always()
      id: gate
      shell: bash
      env:
        SCAN_OUTCOME: ${{ steps.scan.outcome }}
        REPORT_GENERATION_ENABLED: ${{ inputs.generate-sarif }}
      run: |
        set -euo pipefail

        if [[ "$SCAN_OUTCOME" == "success" ]]; then
          echo "Trivy container vulnerability scan passed."
          echo "scan-result=passed" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ "$SCAN_OUTCOME" == "failure" ]]; then
          echo "::error::Trivy detected vulnerabilities at or above the configured severity threshold."
          echo "scan-result=failed" >> "$GITHUB_OUTPUT"
          exit 1
        fi

        echo "::error::Trivy scan completed with unexpected outcome: $SCAN_OUTCOME"
        echo "scan-result=error" >> "$GITHUB_OUTPUT"
        exit 1