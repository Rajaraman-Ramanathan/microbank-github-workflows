name: Application Verification

description: >
  Compiles the application, executes unit tests, generates JaCoCo
  coverage reports, performs SonarQube analysis, and exposes
  generated report locations for downstream workflows.

author: Microbank Platform Team

inputs:
  working-directory:
    description: Maven project root directory.
    required: false
    default: "."

  sonar-project-key:
    description: SonarQube project key.
    required: true

  maven-goals:
    description: Maven lifecycle goals to execute.
    required: false
    default: "verify"

  additional-args:
    description: Additional Maven command line arguments.
    required: false
    default: ""

outputs:
  surefire-report-directory:
    description: Directory containing Surefire XML reports.
    value: ${{ steps.reports.outputs.surefire-report-directory }}

  jacoco-xml-report:
    description: JaCoCo XML coverage report.
    value: ${{ steps.reports.outputs.jacoco-xml-report }}

  jacoco-html-report-directory:
    description: Directory containing JaCoCo HTML coverage report.
    value: ${{ steps.reports.outputs.jacoco-html-report-directory }}

  sonar-report-task-file:
    description: SonarQube report-task.txt file.
    value: ${{ steps.reports.outputs.sonar-report-task-file }}

runs:
  using: composite
  steps:
    - name: Validate Maven Project
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        if [[ ! -f "pom.xml" ]]; then
          echo "::error::pom.xml not found in $PWD."
          exit 1
        fi

        if [[ ! -f "mvnw" ]]; then
          echo "::error::Maven Wrapper (mvnw) not found in $PWD."
          exit 1
        fi

        if [[ ! -f ".mvn/wrapper/maven-wrapper.properties" ]]; then
          echo "::error::Maven Wrapper configuration not found."
          exit 1
        fi

        chmod +x mvnw

        echo "Maven version:"
        ./mvnw --version

    - name: Validate SonarQube Configuration
      shell: bash
      env:
        SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
      run: |
        set -euo pipefail

        if [[ -z "${SONAR_HOST_URL:-}" ]]; then
          echo "::error::SONAR_HOST_URL is not configured."
          exit 1
        fi

        if [[ -z "${SONAR_TOKEN:-}" ]]; then
          echo "::error::SONAR_TOKEN is not configured."
          exit 1
        fi

        if [[ -z "${{ inputs.sonar-project-key }}" ]]; then
          echo "::error::sonar-project-key input cannot be empty."
          exit 1
        fi

    - name: Compile, Test, Verify and SonarQube Analysis
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        MAVEN_GOALS_INPUT: ${{ inputs.maven-goals }}
        ADDITIONAL_ARGS_INPUT: ${{ inputs.additional-args }}
        SONAR_PROJECT_KEY: ${{ inputs.sonar-project-key }}
      run: |
        set -euo pipefail

        read -r -a MAVEN_GOALS <<< "$MAVEN_GOALS_INPUT"

        MAVEN_ARGS=(
          "${MAVEN_GOALS[@]}"
          "sonar:sonar"
          "-Dsonar.projectKey=${SONAR_PROJECT_KEY}"
          "-Dsonar.host.url=${SONAR_HOST_URL}"
          "-Dsonar.token=${SONAR_TOKEN}"
        )

        if [[ -n "$ADDITIONAL_ARGS_INPUT" ]]; then
          read -r -a ADDITIONAL_ARGS <<< "$ADDITIONAL_ARGS_INPUT"
          MAVEN_ARGS+=("${ADDITIONAL_ARGS[@]}")
        fi

        ./mvnw "${MAVEN_ARGS[@]}"

    - name: Verify Generated Reports
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        if [[ ! -d "target/surefire-reports" ]]; then
          echo "::error::Surefire report directory was not generated."
          exit 1
        fi

        if ! find "target/surefire-reports" -type f -print -quit | grep -q .; then
          echo "::error::Surefire report directory is empty."
          exit 1
        fi

        if [[ ! -f "target/site/jacoco/jacoco.xml" ]]; then
          echo "::error::JaCoCo XML report was not generated."
          exit 1
        fi

        if [[ ! -s "target/site/jacoco/jacoco.xml" ]]; then
          echo "::error::JaCoCo XML report is empty."
          exit 1
        fi

        if [[ ! -d "target/site/jacoco" ]]; then
          echo "::error::JaCoCo HTML report directory was not generated."
          exit 1
        fi

        if [[ ! -f "target/sonar/report-task.txt" ]]; then
          echo "::error::SonarQube report-task.txt was not generated."
          exit 1
        fi

        if [[ ! -s "target/sonar/report-task.txt" ]]; then
          echo "::error::SonarQube report-task.txt is empty."
          exit 1
        fi

    - name: Expose Report Locations
      id: reports
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        echo "surefire-report-directory=${PWD}/target/surefire-reports" >> "$GITHUB_OUTPUT"
        echo "jacoco-xml-report=${PWD}/target/site/jacoco/jacoco.xml" >> "$GITHUB_OUTPUT"
        echo "jacoco-html-report-directory=${PWD}/target/site/jacoco" >> "$GITHUB_OUTPUT"
        echo "sonar-report-task-file=${PWD}/target/sonar/report-task.txt" >> "$GITHUB_OUTPUT"