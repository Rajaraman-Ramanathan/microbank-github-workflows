name: Setup Java

description: >
  Configures the Java build environment for Microbank CI/CD workflows.

author: Microbank Platform Team

inputs:
  java-version:
    description: Java version to install.
    required: false
    default: "21"

  distribution:
    description: JDK distribution.
    required: false
    default: "temurin"

  cache:
    description: Dependency cache provider.
    required: false
    default: "maven"

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: ${{ inputs.distribution }}
        java-version: ${{ inputs.java-version }}
        cache: ${{ inputs.cache }}

    - name: Validate Java Installation
      shell: bash
      run: |
        set -euo pipefail

        if ! command -v java >/dev/null 2>&1; then
          echo "::error::Java executable was not found after Java setup."
          exit 1
        fi

        echo "Java version:"
        java --version