name: Burp Suite DAST Scan

description: >
  Runs a Burp Suite DAST CI-driven scan against a deployed application
  and exposes the generated JUnit report for CI/CD release gating.

author: Microbank Platform Team

inputs:
  server-url:
    description: Burp Suite DAST server URL.
    required: true

  api-key:
    description: Burp Suite DAST CI/CD API key.
    required: true

  start-url:
    description: Application URL to scan.
    required: true

  correlation-id:
    description: Correlation ID used to identify the scan.
    required: true

  scanner-image:
    description: >
      Approved Burp Suite CI-driven scanner image. Pin to an immutable
      digest for production use.
    required: true

  report-directory:
    description: Directory where the Burp report is stored.
    required: false
    default: ".github/reports/burp"

outputs:
  junit-report:
    description: Absolute path to the Burp JUnit report.
    value: ${{ steps.scan.outputs.junit-report }}

runs:
  using: composite
  steps:
    - name: Validate Docker CLI
      shell: bash
      run: |
        set -euo pipefail

        if ! command -v docker >/dev/null 2>&1; then
          echo "::error::Docker CLI is required for Burp Suite CI-driven scans."
          exit 1
        fi

        docker --version

    - name: Validate Burp Configuration
      shell: bash
      env:
        SERVER_URL: ${{ inputs.server-url }}
        API_KEY: ${{ inputs.api-key }}
        START_URL: ${{ inputs.start-url }}
        CORRELATION_ID: ${{ inputs.correlation-id }}
        SCANNER_IMAGE: ${{ inputs.scanner-image }}
      run: |
        set -euo pipefail

        if [[ ! "$SERVER_URL" =~ ^https?://[^[:space:]]+$ ]]; then
          echo "::error::Invalid Burp Suite DAST server URL."
          exit 1
        fi

        if [[ -z "$API_KEY" ]]; then
          echo "::error::Burp Suite DAST API key is not configured."
          exit 1
        fi

        if [[ ! "$START_URL" =~ ^https?://[^[:space:]]+$ ]]; then
          echo "::error::Burp scan start URL must use HTTP or HTTPS."
          exit 1
        fi

        if [[ -z "$CORRELATION_ID" ]]; then
          echo "::error::Burp correlation ID must not be empty."
          exit 1
        fi

        if (( ${#CORRELATION_ID} > 64 )); then
          echo "::error::Burp correlation ID must not exceed 64 characters."
          exit 1
        fi

        if [[ -z "$SCANNER_IMAGE" ]]; then
          echo "::error::Burp scanner image must not be empty."
          exit 1
        fi

    - name: Prepare Report Directory
      shell: bash
      env:
        REPORT_DIRECTORY: ${{ inputs.report-directory }}
      run: |
        set -euo pipefail

        mkdir -p "$REPORT_DIRECTORY"

    - name: Run Burp Suite DAST Scan
      shell: bash
      env:
        BURP_SERVER_URL: ${{ inputs.server-url }}
        BURP_API_KEY: ${{ inputs.api-key }}
        BURP_START_URL: ${{ inputs.start-url }}
        BURP_CORRELATION_ID: ${{ inputs.correlation-id }}
        SCANNER_IMAGE: ${{ inputs.scanner-image }}
      run: |
        set -euo pipefail

        docker run \
          --rm \
          --pull=always \
          -u "$(id -u)" \
          -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
          -w "${GITHUB_WORKSPACE}" \
          -e "BURP_ENTERPRISE_SERVER_URL=${BURP_SERVER_URL}" \
          -e "BURP_ENTERPRISE_API_KEY=${BURP_API_KEY}" \
          -e "BURP_START_URL=${BURP_START_URL}" \
          -e "BURP_CORRELATION_ID=${BURP_CORRELATION_ID}" \
          "$SCANNER_IMAGE"

    - name: Verify Burp JUnit Report
      shell: bash
      env:
        REPORT_DIRECTORY: ${{ inputs.report-directory }}
      run: |
        set -euo pipefail

        REPORT_FILE="${REPORT_DIRECTORY}/burp_junit_report.xml"

        if [[ ! -f "$REPORT_FILE" ]]; then
          echo "::error::Burp JUnit report was not generated: $REPORT_FILE"
          exit 1
        fi

        if [[ ! -s "$REPORT_FILE" ]]; then
          echo "::error::Burp JUnit report is empty: $REPORT_FILE"
          exit 1
        fi

        echo "Burp JUnit report generated successfully."

    - name: Expose Burp Report
      id: scan
      shell: bash
      env:
        REPORT_DIRECTORY: ${{ inputs.report-directory }}
      run: |
        set -euo pipefail

        REPORT_FILE="$(realpath "${REPORT_DIRECTORY}/burp_junit_report.xml")"

        echo "junit-report=$REPORT_FILE" >> "$GITHUB_OUTPUT"

        echo "Burp JUnit report: $REPORT_FILE"