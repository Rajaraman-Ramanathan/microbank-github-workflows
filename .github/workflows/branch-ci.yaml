name: Branch CI

on:
  workflow_call:

    inputs:
      java-version:
        description: Java version used for the application build.
        required: false
        type: string
        default: "21"

      maven-cache:
        description: Maven cache used by setup-java.
        required: false
        type: string
        default: "maven"

      jfrog-repository:
        description: JFrog Artifactory Maven repository key.
        required: true
        type: string

      ecr-repository:
        description: Amazon ECR repository name.
        required: true
        type: string

      aws-region:
        description: AWS region containing the ECR repository.
        required: true
        type: string

      trivy-version:
        description: Approved Trivy version.
        required: false
        type: string
        default: "0.72.0"

      expected-container-user:
        description: Expected non-root container runtime user.
        required: false
        type: string
        default: "10001"

      container-severity-threshold:
        description: Container vulnerability severity threshold.
        required: false
        type: string
        default: "HIGH,CRITICAL"

      container-ignore-unfixed:
        description: Whether Trivy should ignore unfixed vulnerabilities.
        required: false
        type: string
        default: "false"

    secrets:
      JF_URL:
        description: JFrog Artifactory URL.
        required: true

      JF_ACCESS_TOKEN:
        description: JFrog access token.
        required: true

      AWS_ECR_ROLE_ARN:
        description: AWS IAM role used to publish images to ECR.
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: branch-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Build application
  # ---------------------------------------------------------------------------

  build:
    name: Build Application
    runs-on: ubuntu-latest
    outputs:
      group-id: ${{ steps.maven-build.outputs.group-id }}
      artifact-id: ${{ steps.maven-build.outputs.artifact-id }}
      project-version: ${{ steps.maven-build.outputs.project-version }}
      artifact-file: ${{ steps.maven-build.outputs.artifact-file }}
      artifact-path: ${{ steps.maven-build.outputs.artifact-path }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: ${{ inputs.maven-cache }}

      - name: Build Maven Application
        id: maven-build
        uses: ./actions/maven-build
        with:
          working-directory: .
          goals: "clean package"
          additional-args: "-DskipTests"

      - name: Verify JAR
        id: jar-verification
        uses: ./actions/jar-verification
        with:
          jar-path: ${{ steps.maven-build.outputs.artifact-path }}

      - name: Upload JAR Artifact
        uses: ./actions/upload-build-artifact
        with:
          artifact-name: ${{ github.event.repository.name }}-jar
          artifact-path: ${{ steps.jar-verification.outputs.artifact-path }}
          retention-days: "1"


  # ---------------------------------------------------------------------------
  # Build, secure and publish container
  # ---------------------------------------------------------------------------

  container:
    name: Build, Secure and Publish
    runs-on: ubuntu-latest
    needs:
      - build
    outputs:
      image-reference: ${{ steps.docker-publish.outputs.image-reference }}
      image-digest: ${{ steps.docker-publish.outputs.image-digest }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download JAR Artifact
        uses: ./actions/download-build-artifact
        with:
          artifact-name: ${{ github.event.repository.name }}-jar
          destination-path: artifacts

      - name: Verify JAR
        id: jar-verification
        uses: ./actions/jar-verification
        with:
          artifact-path: artifacts/${{ needs.build.outputs.artifact-file }}

      - name: Build Container Image
        id: docker-build
        uses: ./actions/docker-build
        with:
          context: .
          dockerfile: Dockerfile
          image-name: ${{ inputs.ecr-repository }}
          image-tag: sha-${{ github.sha }}
          jar-path: ${{ steps.jar-verification.outputs.artifact-path }}

      - name: Verify Container Image
        id: container-verification
        uses: ./actions/container-verification
        with:
          image: ${{ steps.docker-build.outputs.image }}
          expected-user: ${{ inputs.expected-container-user }}

      - name: Scan Container Image
        id: container-scan
        uses: ./actions/container-scan
        with:
          image: ${{ steps.docker-build.outputs.image }}
          severity-threshold: ${{ inputs.container-severity-threshold }}
          ignore-unfixed: ${{ inputs.container-ignore-unfixed }}
          report-directory: .github/reports
          generate-sarif: "true"
          trivy-version: ${{ inputs.trivy-version }}

      - name: Upload Container Scan Report
        if: always()
        uses: ./actions/upload-build-artifact
        with:
          artifact-name: container-scan-${{ github.sha }}
          artifact-path: .github/reports/trivy-container.sarif
          retention-days: "30"

      - name: Generate Container SBOM
        id: sbom
        uses: ./actions/sbom-generation
        with:
          image: ${{ steps.docker-build.outputs.image }}
          report-directory: .github/reports
          generate-cyclonedx: "true"
          generate-spdx: "false"
          trivy-version: ${{ inputs.trivy-version }}

      - name: Upload Container SBOM
        uses: ./actions/upload-build-artifact
        with:
          artifact-name: container-sbom-${{ github.sha }}
          artifact-path: ${{ steps.sbom.outputs.cyclonedx-file }}
          retention-days: "30"

      - name: Security Gate
        shell: bash
        run: |
          set -euo pipefail

          echo "All required container security controls passed."
          echo "Container verification: passed"
          echo "Container vulnerability scan: passed"
          echo "SBOM generation: passed"
          echo "Security gate: passed"

      # -----------------------------------------------------------------------
      # Publish JAR to JFrog
      # -----------------------------------------------------------------------

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Publish JAR to JFrog
        id: jar-publish
        uses: ./actions/jar-publish
        with:
          artifact-path: ${{ steps.jar-verification.outputs.artifact-path }}
          repository: ${{ inputs.jfrog-repository }}
          group-id: ${{ needs.build.outputs.group-id }}
          artifact-id: ${{ needs.build.outputs.artifact-id }}
          version: ${{ needs.build.outputs.project-version }}
          server-id: setup-jfrog-cli-server
          build-name: ${{ github.event.repository.name }}
          build-number: ${{ github.run_number }}

      # -----------------------------------------------------------------------
      # Publish container image to ECR
      # -----------------------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publish Container Image
        id: docker-publish
        uses: ./actions/docker-publish
        with:
          image: ${{ steps.docker-build.outputs.image }}
          registry: ${{ steps.ecr-login.outputs.registry }}
          repository: ${{ inputs.ecr-repository }}
          tag: sha-${{ github.sha }}

      # -----------------------------------------------------------------------
      # Release metadata
      # -----------------------------------------------------------------------

      - name: Create Release Metadata
        shell: bash
        env:
          IMAGE_REFERENCE: ${{ steps.docker-publish.outputs.image-reference }}
          IMAGE_DIGEST: ${{ steps.docker-publish.outputs.image-digest }}
          IMAGE_REPOSITORY: ${{ inputs.ecr-repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p release-metadata

          cat > release-metadata/image.json <<EOF
          {
            "repository": "${IMAGE_REPOSITORY}",
            "image_reference": "${IMAGE_REFERENCE}",
            "image_digest": "${IMAGE_DIGEST}",
            "git_sha": "${SOURCE_SHA}"
          }
          EOF

          cat release-metadata/image.json

      - name: Upload Release Metadata
        uses: ./actions/upload-build-artifact
        with:
          artifact-name: release-metadata
          artifact-path: release-metadata/image.json
          retention-days: "7"


  # ---------------------------------------------------------------------------
  # Branch CI summary
  # ---------------------------------------------------------------------------

  branch-ci-summary:
    name: Branch CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build
      - container
    steps:
      - name: Generate Branch CI Summary
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        run: |
          set -euo pipefail

          result_icon() {
            case "$1" in
              success)
                echo "✅ Passed"
                ;;
              failure)
                echo "❌ Failed"
                ;;
              cancelled)
                echo "⚠️ Cancelled"
                ;;
              skipped)
                echo "⏭️ Skipped"
                ;;
              *)
                echo "❓ Unknown"
                ;;
            esac
          }

          BUILD_STATUS="$(result_icon "$BUILD_RESULT")"
          CONTAINER_STATUS="$(result_icon "$CONTAINER_RESULT")"

          {
            echo "# Branch CI Summary"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Application Build | ${BUILD_STATUS} |"
            echo "| Container Build & Security | ${CONTAINER_STATUS} |"
            echo
            echo "## Build Context"
            echo
            echo "- Repository: \`${REPOSITORY}\`"
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- ECR Repository: \`${ECR_REPOSITORY}\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "::error::Application build stage did not pass."
            exit 1
          fi

          if [[ "$CONTAINER_RESULT" != "success" ]]; then
            echo "::error::Container build and security stage did not pass."
            exit 1
          fi

          echo "## Overall Result" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "✅ **Branch CI passed successfully.**" >> "$GITHUB_STEP_SUMMARY"