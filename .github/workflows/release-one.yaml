name: Release

on:
  workflow_run:
    workflows:
      - Branch CI
    types:
      - completed
    branches:
      - dev

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.event.workflow_run.repository.full_name || github.repository }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: microbank/${{ github.event.repository.name }}

jobs:
  release-context:
    name: Resolve Release Context
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Validate Release Trigger
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$WORKFLOW_NAME" != "Branch CI" ]]; then
              echo "::error::Release was not triggered by Branch CI."
              exit 1
            fi

            if [[ "$WORKFLOW_CONCLUSION" != "success" ]]; then
              echo "::error::Branch CI did not complete successfully."
              exit 1
            fi

            if [[ "$WORKFLOW_BRANCH" != "dev" ]]; then
              echo "::error::Branch CI must originate from the development branch."
              echo "::error::Branch: $WORKFLOW_BRANCH"
              exit 1
            fi
          fi

          echo "Release trigger validation passed."

      - name: Display Release Context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          echo "Release event: $EVENT_NAME"
          echo "Repository: $REPOSITORY"

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            echo "Branch CI run ID: $RUN_ID"
            echo "Source branch: $HEAD_BRANCH"
            echo "Source commit: $HEAD_SHA"
          fi

  resolve-release:
    name: Resolve Release Artifact
    needs:
      - release-context
    runs-on: ubuntu-latest
    outputs:
      image-repository: ${{ steps.release-metadata.outputs.image-repository }}
      image-reference: ${{ steps.release-metadata.outputs.image-reference }}
      image-digest: ${{ steps.release-metadata.outputs.image-digest }}
      source-sha: ${{ steps.release-metadata.outputs.source-sha }}
    steps:
      - name: Download Release Metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: release-metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate Release Metadata
        id: release-metadata
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          METADATA_FILE="release-metadata/image.json"

          if [[ ! -f "$METADATA_FILE" ]]; then
            echo "::error::Release metadata file was not found."
            echo "::error::Expected: $METADATA_FILE"
            exit 1
          fi

          echo "Release metadata:"
          cat "$METADATA_FILE"

          IMAGE_REPOSITORY="$(jq -r '.repository' "$METADATA_FILE")"
          IMAGE_REFERENCE="$(jq -r '.image_reference' "$METADATA_FILE")"
          IMAGE_DIGEST="$(jq -r '.image_digest' "$METADATA_FILE")"
          SOURCE_SHA="$(jq -r '.git_sha' "$METADATA_FILE")"

          if [[ -z "$IMAGE_REPOSITORY" || "$IMAGE_REPOSITORY" == "null" ]]; then
            echo "::error::Image repository is missing from release metadata."
            exit 1
          fi

          if [[ -z "$IMAGE_REFERENCE" || "$IMAGE_REFERENCE" == "null" ]]; then
            echo "::error::Image reference is missing from release metadata."
            exit 1
          fi

          if [[ -z "$IMAGE_DIGEST" || "$IMAGE_DIGEST" == "null" ]]; then
            echo "::error::Image digest is missing from release metadata."
            exit 1
          fi

          if [[ -z "$SOURCE_SHA" || "$SOURCE_SHA" == "null" ]]; then
            echo "::error::Source commit SHA is missing from release metadata."
            exit 1
          fi

          if [[ "$SOURCE_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Release metadata source SHA does not match Branch CI."
            echo "::error::Expected: $EXPECTED_SHA"
            echo "::error::Received: $SOURCE_SHA"
            exit 1
          fi

          if [[ "$IMAGE_REFERENCE" != *@sha256:* ]]; then
            echo "::error::Release image reference is not immutable."
            echo "::error::Image: $IMAGE_REFERENCE"
            exit 1
          fi

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid image digest: $IMAGE_DIGEST"
            exit 1
          fi

          METADATA_DIGEST="${IMAGE_REFERENCE##*@}"

          if [[ "$METADATA_DIGEST" != "$IMAGE_DIGEST" ]]; then
            echo "::error::Image reference digest does not match image_digest."
            echo "::error::Reference digest: $METADATA_DIGEST"
            echo "::error::Metadata digest: $IMAGE_DIGEST"
            exit 1
          fi

          echo "image-repository=$IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "image-reference=$IMAGE_REFERENCE" >> "$GITHUB_OUTPUT"
          echo "image-digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "source-sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          echo "Release artifact validated successfully."
          echo "Image: $IMAGE_REFERENCE"
          echo "Digest: $IMAGE_DIGEST"
          echo "Source SHA: $SOURCE_SHA"


  verify-dev-image:
    name: Verify DEV Image
    needs:
      - resolve-release
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify DEV ECR Image
        shell: bash
        env:
          ECR_REPOSITORY: ${{ needs.resolve-release.outputs.image-repository }}
          IMAGE_DIGEST: ${{ needs.resolve-release.outputs.image-digest }}
        run: |
          set -euo pipefail

          if [[ -z "$ECR_REPOSITORY" ]]; then
            echo "::error::ECR repository is empty."
            exit 1
          fi

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid image digest: $IMAGE_DIGEST"
            exit 1
          fi

          IMAGE_COUNT="$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageDigest="$IMAGE_DIGEST" \
              --query 'length(imageDetails)' \
              --output text
          )"

          if [[ "$IMAGE_COUNT" != "1" ]]; then
            echo "::error::Expected image digest was not found in DEV ECR."
            echo "::error::Repository: $ECR_REPOSITORY"
            echo "::error::Digest: $IMAGE_DIGEST"
            exit 1
          fi

          ACTUAL_DIGEST="$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageDigest="$IMAGE_DIGEST" \
              --query 'imageDetails[0].imageDigest' \
              --output text
          )"

          if [[ "$ACTUAL_DIGEST" != "$IMAGE_DIGEST" ]]; then
            echo "::error::DEV ECR returned an unexpected image digest."
            echo "::error::Expected: $IMAGE_DIGEST"
            echo "::error::Received: $ACTUAL_DIGEST"
            exit 1
          fi

          echo "DEV ECR image verified successfully."
          echo "Repository: $ECR_REPOSITORY"
          echo "Digest: $ACTUAL_DIGEST"

  sign-image:
    name: Sign Container Image
    needs:
      - verify-dev-image
    runs-on: ubuntu-latest
    outputs:
      image-reference: ${{ steps.image-sign.outputs.image }}
      image-digest: ${{ steps.image-sign.outputs.image-digest }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Sign Container Image
        id: image-sign
        uses: ./actions/image-sign
        with:
          image: ${{ needs.resolve-release.outputs.image-reference }}
          kms-key-uri: ${{ vars.COSIGN_KMS_KEY_URI }}
          cosign-version: ${{ vars.COSIGN_VERSION }}

  deploy-dev:
    name: Deploy to DEV
    needs:
    - sign-image
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
    - name: Checkout Application Repository
      uses: actions/checkout@v4

    - name: Update DEV GitOps
      uses: ./actions/gitops-image-update
      with:
        gitops-repository: microbank/microbank-gitops
        gitops-branch: dev
        environment: dev
        service-directory: account
        image-digest: ${{ needs.resolve-release.outputs.image-digest }}
        source-sha: ${{ needs.resolve-release.outputs.source-sha }}
        token: ${{ secrets.GITOPS_TOKEN }}


  validate-dev:
    name: Validate DEV
    needs:
    - deploy-dev
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
    - name: Validate DEV Application
      uses: ./actions/application-testing
      with:
        base-url: ${{ vars.DEV_APPLICATION_URL }}
        health-path: /actuator/health