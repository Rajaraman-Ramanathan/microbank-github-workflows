name: Release

on:
  workflow_call:

    inputs:
      # ----------------------------------------------------------------
      # Release artifact
      # ----------------------------------------------------------------

      image-reference:
        description: >
          Immutable container image reference produced by Branch CI.
          Example:
          <registry>/<repository>@sha256:<digest>
        required: true
        type: string

      image-digest:
        description: >
          Immutable SHA-256 digest of the container image.
        required: true
        type: string

      image-repository:
        description: >
          ECR repository containing the release image.
          Example: microbank/account-service
        required: true
        type: string

      source-sha:
        description: >
          Git commit SHA from which the release image was built.
        required: true
        type: string

      # ----------------------------------------------------------------
      # AWS release configuration
      # ----------------------------------------------------------------

      aws-region:
        description: >
          AWS region used for release operations.
        required: true
        type: string

      # ----------------------------------------------------------------
      # GitOps configuration
      # ----------------------------------------------------------------

      gitops-repository:
        description: >
          GitOps repository containing Kubernetes deployment configuration.
        required: true
        type: string

      gitops-branch:
        description: >
          Git branch to update in the GitOps repository.
        required: true
        type: string

      service-directory:
        description: >
          Service directory under the target GitOps environment.
          Example: account
        required: true
        type: string

      # ----------------------------------------------------------------
      # Application validation
      # ----------------------------------------------------------------

      health-path:
        description: >
          Application health endpoint used by environment smoke tests.
        required: false
        type: string
        default: "/actuator/health"

      dev-application-url:
        description: >
          Base URL used to validate the DEV application deployment.
        required: true
        type: string

      # ----------------------------------------------------------------
      # Image signing
      # ----------------------------------------------------------------

      cosign-kms-key-uri:
        description: >
          AWS KMS URI used by Cosign to sign the container image.
        required: true
        type: string

      cosign-version:
        description: >
          Cosign version used for image signing.
        required: true
        type: string

      dev-ecr-registry:
        description: > 
          DEV ECR registry hostname.
        required: true
        type: string

      stage-ecr-registry:
        description: >
          STAGE ECR registry hostname.
        required: true
        type: string

      prod-ecr-registry:
        description: >
          PROD ECR registry hostname.
        required: true
        type: string

      # ----------------------------------------------------------------
      # STAGE Test Automation
      # ----------------------------------------------------------------

      test-repository:
        description: >
          Dedicated automated test repository for the application.
          The repository contains integration, system, regression,
          smoke, and other application-specific test suites.
        required: true
        type: string

      test-repository-ref:
        description: >
          Immutable Git reference of the test repository to execute.
          A commit SHA is preferred for release traceability.
        required: true
        type: string

      stage-application-url:
        description: >
          Base URL of the deployed STAGE application used by the
          automated integration and system test suites.
        required: true
        type: string

      # ----------------------------------------------------------------
      # Burp Suite DAST
      # ----------------------------------------------------------------

      burp-server-url:
        description: >
          Burp Suite DAST server URL used by CI-driven scans.
        required: true
        type: string

      burp-scanner-image:
        description: >
          Immutable Burp Suite CI-driven scanner container reference.
          Pin this to an approved image digest for production use.
        required: true
        type: string

      burp-correlation-id:
        description: >
          Identifier used to associate the CI-driven scan with a site
          in Burp Suite DAST.
        required: true
        type: string

      production-environment:
        description: >
          GitHub Environment used to enforce production approval
          and deployment protection rules.
        required: true
        type: string

      prod-namespace:
        description: Kubernetes namespace containing the PROD Argo Rollout.
        required: true
        type: string

      prod-kube-context:
        description: Kubernetes context used to access the PROD cluster.
        required: true
        type: string

      prod-application-url:
        description: Base URL used for PROD application smoke testing.
        required: true
        type: string

    outputs:
      stage-image-digest:
        value: ${{ jobs.promote-stage-image.outputs.image-digest }}

      stage-image-reference:
        value: ${{ jobs.promote-stage-image.outputs.image-reference }}

    secrets:
      dev-release-role-arn:
        description: >
          IAM role assumed for DEV ECR verification and image signing.
        required: true

      gitops-token:
        description: >
          Credential used to update the GitOps repository.
        required: true

      test-repository-token:
        description: >
          Read-only credential used to checkout the application's
          dedicated automated test repository.
        required: true

      burp-api-key:
        description: >
          Burp Suite DAST API key used by the CI-driven scanner.
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ inputs.image-digest }}
  cancel-in-progress: false


jobs:
  resolve-release:
    name: Resolve Release Artifact
    runs-on: ubuntu-latest
    outputs:
      image-repository: ${{ steps.validate.outputs.image-repository }}
      image-reference: ${{ steps.validate.outputs.image-reference }}
      image-digest: ${{ steps.validate.outputs.image-digest }}
      source-sha: ${{ steps.validate.outputs.source-sha }}
    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Validate Release Artifact
        id: validate
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ inputs.image-repository }}
          IMAGE_REFERENCE: ${{ inputs.image-reference }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          DEV_ECR_REPOSITORY: ${{ inputs.image-repository }}
        run: |
          chmod +x scripts/release/validate-release-artifact.sh
          scripts/release/validate-release-artifact.sh

  verify-dev-image:
    name: Verify DEV Image
    needs:
      - resolve-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.dev-release-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Verify DEV ECR Image
        shell: bash
        env:
          ECR_REPOSITORY: ${{ inputs.image-repository }}
          IMAGE_DIGEST: ${{ needs.resolve-release.outputs.image-digest }}
        run: |
          chmod +x scripts/release/verify-dev-image.sh
          scripts/release/verify-dev-image.sh

  sign-image:
    name: Sign Container Image
    needs:
      - resolve-release
      - verify-dev-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image-reference: ${{ steps.image-sign.outputs.image }}
      image-digest: ${{ steps.image-sign.outputs.image-digest }}
    steps:
      # Required because the central reusable workflow invokes a
      # local composite action using ./actions/image-sign.
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.dev-release-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Sign Container Image
        id: image-sign
        uses: ./actions/image-sign
        with:
          image: ${{ needs.resolve-release.outputs.image-reference }}
          kms-key-uri: ${{ inputs.cosign-kms-key-uri }}
          cosign-version: ${{ inputs.cosign-version }}

  deploy-dev:
    name: Deploy to DEV
    needs:
      - resolve-release
      - sign-image
    runs-on: ubuntu-latest
    steps:
      - name: Update DEV GitOps
        uses: ./actions/gitops-image-update
        with:
          gitops-repository: ${{ inputs.gitops-repository }}
          gitops-branch: ${{ inputs.gitops-branch }}
          environment: dev
          service-directory: ${{ inputs.service-directory }}
          image-digest: ${{ needs.sign-image.outputs.image-digest }}
          source-sha: ${{ needs.resolve-release.outputs.source-sha }}
          token: ${{ secrets.GITOPS_TOKEN }}

  smoke-test-dev:
    name: DEV Smoke Tests
    needs:
    - deploy-dev
    runs-on: ubuntu-latest
    steps:
    - name: Run DEV Smoke Test Suite
      id: smoke-tests
      uses: ./actions/test-suite-runner
      with:
        test-repository: ${{ inputs.test-repository }}
        test-repository-ref: ${{ inputs.test-repository-ref }}
        token: ${{ secrets.test-repository-token }}
        suite: smoke
        base-url: ${{ inputs.dev-application-url }}
        test-environment: dev
        working-directory: test-suite
        test-results-directory: test-results

    - name: Upload DEV Smoke Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dev-smoke-test-results
        path: ${{ steps.smoke-tests.outputs.test-results-directory }}
        if-no-files-found: error
        retention-days: 30

  promote-stage-image:
    name: Promote Image to STAGE ECR
    needs:
      - smoke-test-dev
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.ecr-promotion.outputs.image-digest }}
      image-reference: ${{ steps.ecr-promotion.outputs.image-reference }}
    steps:
      - name: Configure STAGE AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ secrets.stage-release-role-arn }}

      - name: Promote Image to STAGE ECR
        id: ecr-promotion
        uses: ./actions/ecr-image-promote
        env:
          AWS_REGION: ${{ inputs.aws-region }}
        with:
          source-registry: ${{ inputs.dev-ecr-registry }}
          destination-registry: ${{ inputs.stage-ecr-registry }}
          repository: ${{ inputs.image-repository }}
          image-digest: ${{ inputs.image-digest }}
          cosign-version: ${{ inputs.cosign-version }}
          cosign-kms-key-uri: ${{ inputs.cosign-kms-key-uri }}

  deploy-stage:
    name: Deploy to STAGE
    needs:
      - resolve-release
      - promote-stage-image
    runs-on: ubuntu-latest
    steps:
      - name: Update STAGE GitOps
        uses: ./actions/gitops-image-update
        with:
          gitops-repository: ${{ inputs.gitops-repository }}
          gitops-branch: ${{ inputs.gitops-branch }}
          environment: stage
          service-directory: ${{ inputs.service-directory }}
          image-digest: ${{ needs.promote-stage-image.outputs.image-digest }}
          source-sha: ${{ needs.resolve-release.outputs.source-sha }}
          token: ${{ secrets.gitops-token }}

  integration:
    name: STAGE Integration Tests
    needs:
      - deploy-stage
    runs-on: ubuntu-latest
    steps:
      - name: Run Integration Test Suite
        id: integration-tests
        uses: ./actions/test-suite-runner
        with:
          test-repository: ${{ inputs.test-repository }}
          test-repository-ref: ${{ inputs.test-repository-ref }}
          token: ${{ secrets.test-repository-token }}
          suite: integration
          base-url: ${{ inputs.stage-application-url }}
          test-environment: stage
          working-directory: test-suite
          test-results-directory: test-results

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ${{ steps.integration-tests.outputs.test-results-directory }}
          if-no-files-found: error
          retention-days: 30

  system-e2e:
    name: STAGE System E2E Tests
    needs:
      - integration
    runs-on: ubuntu-latest
    steps:
      - name: Run System E2E Test Suite
        id: system-tests
        uses: ./actions/test-suite-runner
        with:
          test-repository: ${{ inputs.test-repository }}
          test-repository-ref: ${{ inputs.test-repository-ref }}
          token: ${{ secrets.test-repository-token }}
          suite: system
          base-url: ${{ inputs.stage-application-url }}
          test-environment: stage
          working-directory: test-suite
          test-results-directory: test-results

      - name: Upload System E2E Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-e2e-test-results
          path: ${{ steps.system-tests.outputs.test-results-directory }}
          if-no-files-found: error
          retention-days: 30

  dast:
    name: STAGE DAST
    needs:
      - system-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Run Burp Suite DAST
        id: burp
        uses: ./actions/burp-dast-scan
        with:
          server-url: ${{ inputs.burp-server-url }}
          api-key: ${{ secrets.burp-api-key }}
          start-url: ${{ inputs.stage-application-url }}
          correlation-id: ${{ inputs.burp-correlation-id }}
          scanner-image: ${{ inputs.burp-scanner-image }}
          report-directory: .github/reports/burp

      - name: Upload Burp DAST Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burp-dast-report
          path: ${{ steps.burp.outputs.junit-report }}
          if-no-files-found: error
          retention-days: 30

  stage-release-gate:
    name: STAGE Release Gate
    if: always()
    needs:
      - integration
      - system-e2e
      - dast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Evaluate STAGE Validation
        shell: bash
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SYSTEM_RESULT: ${{ needs.system-e2e.result }}
          DAST_RESULT: ${{ needs.dast.result }}
        run: |
          chmod +x scripts/release/evaluate-stage-validation.sh
          scripts/release/evaluate-stage-validation.sh

  production-approval:
    name: Production Approval
    needs:
      - stage-release-gate
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.production-environment }}
    steps:
      - name: Production Approval Granted
        shell: bash
        run: |
          set -euo pipefail

          echo "Production approval granted."
          echo "Production environment: ${{ inputs.production-environment }}"
          echo "The release is authorized to proceed to PROD."

  promote-prod-image:
    name: Promote Image to PROD ECR
    needs:
      - production-approval
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.ecr-promotion.outputs.image-digest }}
      image-reference: ${{ steps.ecr-promotion.outputs.image-reference }}
    steps:
      - name: Configure PROD AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ secrets.prod-release-role-arn }}

      - name: Promote Image to PROD ECR
        id: ecr-promotion
        uses: ./actions/ecr-image-promote
        env:
          AWS_REGION: ${{ inputs.aws-region }}
        with:
          source-registry: ${{ inputs.stage-ecr-registry }}
          destination-registry: ${{ inputs.prod-ecr-registry }}
          repository: ${{ inputs.image-repository }}
          image-digest: ${{ inputs.image-digest }}
          cosign-version: ${{ inputs.cosign-version }}
          cosign-kms-key-uri: ${{ inputs.cosign-kms-key-uri }}

  deploy-prod:
    name: Deploy to PROD
    needs:
      - promote-prod-image
    runs-on: ubuntu-latest
    steps:
      - name: Update PROD GitOps
        uses: ./actions/gitops-image-update
        with:
          gitops-repository: ${{ inputs.gitops-repository }}
          gitops-branch: ${{ inputs.gitops-branch }}
          environment: prod
          service-directory: ${{ inputs.service-directory }}
          image-digest: ${{ needs.promote-prod-image.outputs.image-digest }}
          source-sha: ${{ inputs.source-sha }}
          token: ${{ secrets.gitops-token }}

  validate-prod:
    name: Validate PROD Deployment
    needs:
      - deploy-prod
      - promote-prod-image
    runs-on: ubuntu-latest
    steps:
      - name: Validate PROD Argo Rollout
        uses: ./actions/argo-rollout-validation
        with:
          namespace: ${{ inputs.prod-namespace }}
          rollout-name: ${{ inputs.service-directory }}
          image-repository: ${{ inputs.image-repository }}
          image-digest: ${{ needs.promote-prod-image.outputs.image-digest }}
          kube-context: ${{ inputs.prod-kube-context }}

  prod-smoke-test:
    name: PROD Smoke Tests
    needs:
    - validate-prod
    runs-on: ubuntu-latest
    steps:
    - name: Run PROD Smoke Test Suite
      id: prod-smoke
      uses: ./actions/test-suite-runner
      with:
        test-repository: ${{ inputs.test-repository }}
        test-repository-ref: ${{ inputs.test-repository-ref }}
        token: ${{ secrets.test-repository-token }}
        suite: smoke
        base-url: ${{ inputs.prod-application-url }}
        test-environment: prod
        working-directory: test-suite
        test-results-directory: test-results

    - name: Upload PROD Smoke Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: prod-smoke-test-results
        path: ${{ steps.prod-smoke.outputs.test-results-directory }}
        if-no-files-found: error
        retention-days: 30

  release-summary:
    name: Release Summary
    if: always()
    needs:
    - verify-dev-image
    - sign-image
    - deploy-dev
    - smoke-test-dev
    - promote-stage-image
    - deploy-stage
    - integration
    - system-e2e
    - dast
    - promote-prod-image
    - deploy-prod
    - validate-prod
    - prod-smoke-test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    - name: Generate Release Summary
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source-sha }}
        IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        IMAGE_DIGEST: ${{ inputs.image-digest }}

        VERIFY_DEV_RESULT: ${{ needs.verify-dev-image.result }}
        PROMOTE_STAGE_RESULT: ${{ needs.promote-stage-image.result }}
        PROMOTE_PROD_RESULT: ${{ needs.promote-prod-image.result }}

        DEPLOY_DEV_RESULT: ${{ needs.deploy-dev.result }}
        DEV_SMOKE_RESULT: ${{ needs.smoke-test-dev.result }}
        DEPLOY_STAGE_RESULT: ${{ needs.deploy-stage.result }}
        DEPLOY_PROD_RESULT: ${{ needs.deploy-prod.result }}

        INTEGRATION_RESULT: ${{ needs.integration.result }}
        SYSTEM_E2E_RESULT: ${{ needs.system-e2e.result }}
        DAST_RESULT: ${{ needs.dast.result }}

        VALIDATE_PROD_RESULT: ${{ needs.validate-prod.result }}
        PROD_SMOKE_RESULT: ${{ needs.prod-smoke-test.result }}

        PROD_IMAGE_REFERENCE: ${{ needs.promote-prod-image.outputs.image-reference }}
        PROD_IMAGE_DIGEST: ${{ needs.promote-prod-image.outputs.image-digest }}

        RELEASE_STATUS: ${{ needs.prod-smoke-test.result }}

      run: |
        set -euo pipefail

        chmod +x scripts/release-summary.sh

        ./scripts/release-summary.sh