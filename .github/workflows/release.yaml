name: Release

on:
  workflow_call:

    inputs:
      # ----------------------------------------------------------------
      # Release artifact
      # ----------------------------------------------------------------

      image-reference:
        description: >
          Immutable container image reference produced by Branch CI.
          Example:
          <registry>/<repository>@sha256:<digest>
        required: true
        type: string

      image-digest:
        description: >
          Immutable SHA-256 digest of the container image.
        required: true
        type: string

      image-repository:
        description: >
          ECR repository containing the release image.
          Example: microbank/account-service
        required: true
        type: string

      source-sha:
        description: >
          Git commit SHA from which the release image was built.
        required: true
        type: string

      # ----------------------------------------------------------------
      # AWS release configuration
      # ----------------------------------------------------------------

      aws-region:
        description: >
          AWS region used for release operations.
        required: true
        type: string

      # ----------------------------------------------------------------
      # GitOps configuration
      # ----------------------------------------------------------------

      gitops-repository:
        description: >
          GitOps repository containing Kubernetes deployment configuration.
        required: true
        type: string

      gitops-branch:
        description: >
          Git branch to update in the GitOps repository.
        required: true
        type: string

      service-directory:
        description: >
          Service directory under the target GitOps environment.
          Example: account
        required: true
        type: string

      # ----------------------------------------------------------------
      # Application validation
      # ----------------------------------------------------------------

      health-path:
        description: >
          Application health endpoint used by environment smoke tests.
        required: false
        type: string
        default: "/actuator/health"

      dev-application-url:
        description: >
          Base URL used to validate the DEV application deployment.
        required: true
        type: string

      # ----------------------------------------------------------------
      # Image signing
      # ----------------------------------------------------------------

      cosign-kms-key-uri:
        description: >
          AWS KMS URI used by Cosign to sign the container image.
        required: true
        type: string

      cosign-version:
        description: >
          Cosign version used for image signing.
        required: true
        type: string

      dev-ecr-registry:
        description: > 
          DEV ECR registry hostname.
        required: true
        type: string

      stage-ecr-registry:
        description: >
          STAGE ECR registry hostname.
        required: true
        type: string

      # ----------------------------------------------------------------
      # STAGE Test Automation
      # ----------------------------------------------------------------

      test-repository:
        description: >
          Dedicated automated test repository for the application.
          The repository contains integration, system, regression,
          smoke, and other application-specific test suites.
        required: true
        type: string

      test-repository-ref:
        description: >
          Immutable Git reference of the test repository to execute.
          A commit SHA is preferred for release traceability.
        required: true
        type: string

      stage-application-url:
        description: >
          Base URL of the deployed STAGE application used by the
          automated integration and system test suites.
        required: true
        type: string

      # ----------------------------------------------------------------
      # Burp Suite DAST
      # ----------------------------------------------------------------

      burp-server-url:
        description: >
          Burp Suite DAST server URL used by CI-driven scans.
        required: true
        type: string

      burp-scanner-image:
        description: >
          Immutable Burp Suite CI-driven scanner container reference.
          Pin this to an approved image digest for production use.
        required: true
        type: string

      burp-correlation-id:
        description: >
          Identifier used to associate the CI-driven scan with a site
          in Burp Suite DAST.
        required: true
        type: string

    outputs:
      stage-image-digest:
        value: ${{ jobs.promote-stage-image.outputs.image-digest }}

      stage-image-reference:
        value: ${{ jobs.promote-stage-image.outputs.image-reference }}

    secrets:
      dev-release-role-arn:
        description: >
          IAM role assumed for DEV ECR verification and image signing.
        required: true

      gitops-token:
        description: >
          Credential used to update the GitOps repository.
        required: true

      test-repository-token:
        description: >
          Read-only credential used to checkout the application's
          dedicated automated test repository.
        required: true

      burp-api-key:
        description: >
          Burp Suite DAST API key used by the CI-driven scanner.
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ inputs.image-digest }}
  cancel-in-progress: false


jobs:
  resolve-release:
    name: Resolve Release Artifact
    runs-on: ubuntu-latest
    outputs:
      image-repository: ${{ steps.validate.outputs.image-repository }}
      image-reference: ${{ steps.validate.outputs.image-reference }}
      image-digest: ${{ steps.validate.outputs.image-digest }}
      source-sha: ${{ steps.validate.outputs.source-sha }}
    steps:
      - name: Validate Release Artifact
        id: validate
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ inputs.image-repository }}
          IMAGE_REFERENCE: ${{ inputs.image-reference }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          DEV_ECR_REPOSITORY: ${{ inputs.image-repository }}
        run: |
          set -euo pipefail

          echo "Validating release artifact..."

          # ------------------------------------------------------------
          # Validate required values
          # ------------------------------------------------------------

          if [[ -z "$IMAGE_REPOSITORY" ]]; then
            echo "::error::Image repository must not be empty."
            exit 1
          fi

          if [[ -z "$IMAGE_REFERENCE" ]]; then
            echo "::error::Image reference must not be empty."
            exit 1
          fi

          if [[ -z "$IMAGE_DIGEST" ]]; then
            echo "::error::Image digest must not be empty."
            exit 1
          fi

          if [[ -z "$SOURCE_SHA" ]]; then
            echo "::error::Source SHA must not be empty."
            exit 1
          fi

          # ------------------------------------------------------------
          # Validate image digest
          # ------------------------------------------------------------

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid image digest."
            echo "::error::Digest: $IMAGE_DIGEST"
            exit 1
          fi

          # ------------------------------------------------------------
          # Validate immutable image reference
          # ------------------------------------------------------------

          if [[ "$IMAGE_REFERENCE" != *@sha256:* ]]; then
            echo "::error::Image reference must use an immutable digest."
            echo "::error::Reference: $IMAGE_REFERENCE"
            exit 1
          fi

          METADATA_DIGEST="${IMAGE_REFERENCE##*@}"

          if [[ "$METADATA_DIGEST" != "$IMAGE_DIGEST" ]]; then
            echo "::error::Image reference digest does not match image digest."
            echo "::error::Reference digest: $METADATA_DIGEST"
            echo "::error::Image digest: $IMAGE_DIGEST"
            exit 1
          fi

          # ------------------------------------------------------------
          # Validate source Git SHA
          # ------------------------------------------------------------

          if [[ ! "$SOURCE_SHA" =~ ^([a-f0-9]{40}|[a-f0-9]{64})$ ]]; then
            echo "::error::Invalid source Git SHA."
            echo "::error::Source SHA: $SOURCE_SHA"
            exit 1
          fi

          # ------------------------------------------------------------
          # Extract repository from immutable image reference
          #
          # Example:
          #
          # 123456789012.dkr.ecr.ap-south-1.amazonaws.com/
          # microbank/account-service@sha256:...
          #
          # becomes:
          #
          # microbank/account-service
          # ------------------------------------------------------------

          IMAGE_REFERENCE_WITHOUT_DIGEST="${IMAGE_REFERENCE%@*}"

          if [[ -z "$IMAGE_REFERENCE_WITHOUT_DIGEST" ]]; then
            echo "::error::Unable to extract repository from image reference."
            echo "::error::Image reference: $IMAGE_REFERENCE"
            exit 1
          fi

          IMAGE_REFERENCE_REPOSITORY="${IMAGE_REFERENCE_WITHOUT_DIGEST#*/}"

          if [[ -z "$IMAGE_REFERENCE_REPOSITORY" ||
                "$IMAGE_REFERENCE_REPOSITORY" == "$IMAGE_REFERENCE_WITHOUT_DIGEST" ]]; then
            echo "::error::Unable to determine ECR repository from image reference."
            echo "::error::Image reference: $IMAGE_REFERENCE"
            exit 1
          fi

          # ------------------------------------------------------------
          # Validate metadata repository against image reference
          # ------------------------------------------------------------

          if [[ "$IMAGE_REFERENCE_REPOSITORY" != "$IMAGE_REPOSITORY" ]]; then
            echo "::error::Image repository does not match image reference."
            echo "::error::Metadata repository: $IMAGE_REPOSITORY"
            echo "::error::Reference repository: $IMAGE_REFERENCE_REPOSITORY"
            exit 1
          fi

          # ------------------------------------------------------------
          # Validate release repository against expected DEV repository
          # ------------------------------------------------------------

          if [[ "$IMAGE_REPOSITORY" != "$DEV_ECR_REPOSITORY" ]]; then
            echo "::error::Release image repository does not match DEV ECR repository."
            echo "::error::Release repository: $IMAGE_REPOSITORY"
            echo "::error::DEV ECR repository: $DEV_ECR_REPOSITORY"
            exit 1
          fi

          # ------------------------------------------------------------
          # Export validated outputs
          # ------------------------------------------------------------

          echo "image-repository=$IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "image-reference=$IMAGE_REFERENCE" >> "$GITHUB_OUTPUT"
          echo "image-digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "source-sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          echo
          echo "Release artifact validated successfully."
          echo "Repository: $IMAGE_REPOSITORY"
          echo "Image:      $IMAGE_REFERENCE"
          echo "Digest:     $IMAGE_DIGEST"
          echo "Source SHA: $SOURCE_SHA"

  verify-dev-image:
    name: Verify DEV Image
    needs:
      - resolve-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.dev-release-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Verify DEV ECR Image
        shell: bash
        env:
          ECR_REPOSITORY: ${{ inputs.image-repository }}
          IMAGE_DIGEST: ${{ needs.resolve-release.outputs.image-digest }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid image digest."
            echo "::error::Digest: $IMAGE_DIGEST"
            exit 1
          fi

          echo "Checking DEV ECR image..."

          IMAGE_COUNT="$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageDigest="$IMAGE_DIGEST" \
              --query 'length(imageDetails)' \
              --output text
          )"

          if [[ "$IMAGE_COUNT" != "1" ]]; then
            echo "::error::Expected image digest was not found in DEV ECR."
            echo "::error::Repository: $ECR_REPOSITORY"
            echo "::error::Digest: $IMAGE_DIGEST"
            exit 1
          fi

          ACTUAL_DIGEST="$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageDigest="$IMAGE_DIGEST" \
              --query 'imageDetails[0].imageDigest' \
              --output text
          )"

          if [[ "$ACTUAL_DIGEST" != "$IMAGE_DIGEST" ]]; then
            echo "::error::DEV ECR returned an unexpected image digest."
            echo "::error::Expected: $IMAGE_DIGEST"
            echo "::error::Received: $ACTUAL_DIGEST"
            exit 1
          fi

          echo "DEV ECR image verified successfully."
          echo "Repository: $ECR_REPOSITORY"
          echo "Digest:     $ACTUAL_DIGEST"

  sign-image:
    name: Sign Container Image
    needs:
      - resolve-release
      - verify-dev-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image-reference: ${{ steps.image-sign.outputs.image }}
      image-digest: ${{ steps.image-sign.outputs.image-digest }}
    steps:
      # Required because the central reusable workflow invokes a
      # local composite action using ./actions/image-sign.
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.dev-release-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Sign Container Image
        id: image-sign
        uses: ./actions/image-sign
        with:
          image: ${{ needs.resolve-release.outputs.image-reference }}
          kms-key-uri: ${{ inputs.cosign-kms-key-uri }}
          cosign-version: ${{ inputs.cosign-version }}

  deploy-dev:
    name: Deploy to DEV
    needs:
      - resolve-release
      - sign-image
    runs-on: ubuntu-latest
    steps:
      - name: Update DEV GitOps
        uses: ./actions/gitops-image-update
        with:
          gitops-repository: ${{ inputs.gitops-repository }}
          gitops-branch: ${{ inputs.gitops-branch }}
          environment: dev
          service-directory: ${{ inputs.service-directory }}
          image-digest: ${{ needs.sign-image.outputs.image-digest }}
          source-sha: ${{ needs.resolve-release.outputs.source-sha }}
          token: ${{ secrets.GITOPS_TOKEN }}

  smoke-test-dev:
    name: DEV Smoke Test
    needs:
      - deploy-dev
    runs-on: ubuntu-latest
    steps:
      - name: Run DEV Smoke Test
        uses: ./actions/application-testing
        with:
          base-url: ${{ inputs.dev-application-url }}
          health-path: ${{ inputs.health-path }}
          expected-status: "200"
          attempts: "12"
          retry-delay: "10"
          connect-timeout: "5"
          request-timeout: "15"

  promote-stage-image:
    name: Promote Image to STAGE ECR
    needs:
      - smoke-test-dev
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.ecr-promotion.outputs.image-digest }}
      image-reference: ${{ steps.ecr-promotion.outputs.image-reference }}
    steps:
      - name: Configure STAGE AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ secrets.stage-release-role-arn }}

      - name: Promote Image to STAGE ECR
        id: ecr-promotion
        uses: ./actions/ecr-image-promote
        env:
          AWS_REGION: ${{ inputs.aws-region }}
        with:
          source-registry: ${{ inputs.dev-ecr-registry }}
          destination-registry: ${{ inputs.stage-ecr-registry }}
          repository: ${{ inputs.image-repository }}
          image-digest: ${{ inputs.image-digest }}
          cosign-version: ${{ inputs.cosign-version }}
          cosign-kms-key-uri: ${{ inputs.cosign-kms-key-uri }}

  deploy-stage:
    name: Deploy to STAGE
    needs:
      - resolve-release
      - promote-stage-image
    runs-on: ubuntu-latest
    steps:
      - name: Update STAGE GitOps
        uses: ./actions/gitops-image-update
        with:
          gitops-repository: ${{ inputs.gitops-repository }}
          gitops-branch: ${{ inputs.gitops-branch }}
          environment: stage
          service-directory: ${{ inputs.service-directory }}
          image-digest: ${{ needs.promote-stage-image.outputs.image-digest }}
          source-sha: ${{ needs.resolve-release.outputs.source-sha }}
          token: ${{ secrets.gitops-token }}

  integration:
    name: STAGE Integration Tests
    needs:
      - deploy-stage
    runs-on: ubuntu-latest
    steps:
      - name: Run Integration Test Suite
        id: integration-tests
        uses: ./actions/test-suite-runner
        with:
          test-repository: ${{ inputs.test-repository }}
          test-repository-ref: ${{ inputs.test-repository-ref }}
          token: ${{ secrets.test-repository-token }}
          suite: integration
          base-url: ${{ inputs.stage-application-url }}
          test-environment: stage
          working-directory: test-suite
          test-results-directory: test-results

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ${{ steps.integration-tests.outputs.test-results-directory }}
          if-no-files-found: error
          retention-days: 30

  system-e2e:
    name: STAGE System E2E Tests
    needs:
      - integration
    runs-on: ubuntu-latest
    steps:
      - name: Run System E2E Test Suite
        id: system-tests
        uses: ./actions/test-suite-runner
        with:
          test-repository: ${{ inputs.test-repository }}
          test-repository-ref: ${{ inputs.test-repository-ref }}
          token: ${{ secrets.test-repository-token }}
          suite: system
          base-url: ${{ inputs.stage-application-url }}
          test-environment: stage
          working-directory: test-suite
          test-results-directory: test-results

      - name: Upload System E2E Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-e2e-test-results
          path: ${{ steps.system-tests.outputs.test-results-directory }}
          if-no-files-found: error
          retention-days: 30

  dast:
    name: STAGE DAST
    needs:
      - system-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Run Burp Suite DAST
        id: burp
        uses: ./actions/burp-dast-scan
        with:
          server-url: ${{ inputs.burp-server-url }}
          api-key: ${{ secrets.burp-api-key }}
          start-url: ${{ inputs.stage-application-url }}
          correlation-id: ${{ inputs.burp-correlation-id }}
          scanner-image: ${{ inputs.burp-scanner-image }}
          report-directory: .github/reports/burp

      - name: Upload Burp DAST Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burp-dast-report
          path: ${{ steps.burp.outputs.junit-report }}
          if-no-files-found: error
          retention-days: 30

  stage-release-gate:
    name: STAGE Release Gate
    if: always()
    needs:
      - integration
      - system-e2e
      - dast
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate STAGE Validation
        shell: bash
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SYSTEM_RESULT: ${{ needs.system-e2e.result }}
          DAST_RESULT: ${{ needs.dast.result }}
        run: |
          set -euo pipefail

          result_icon() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "❌ Failed" ;;
              cancelled) echo "⚠️ Cancelled" ;;
              skipped) echo "⏭️ Skipped" ;;
              *) echo "❓ Unknown" ;;
            esac
          }

          {
            echo "# STAGE Release Validation"
            echo
            echo "| Validation | Result |"
            echo "|---|---|"
            echo "| Integration Tests | $(result_icon "$INTEGRATION_RESULT") |"
            echo "| System / E2E Tests | $(result_icon "$SYSTEM_RESULT") |"
            echo "| Burp Suite DAST | $(result_icon "$DAST_RESULT") |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          FAILED=false

          if [[ "$INTEGRATION_RESULT" != "success" ]]; then
            echo "::error::STAGE integration tests did not pass."
            FAILED=true
          fi

          if [[ "$SYSTEM_RESULT" != "success" ]]; then
            echo "::error::STAGE system/E2E tests did not pass."
            FAILED=true
          fi

          if [[ "$DAST_RESULT" != "success" ]]; then
            echo "::error::STAGE DAST validation did not pass."
            FAILED=true
          fi

          if [[ "$FAILED" == "true" ]]; then
            echo "## STAGE Release Gate: FAILED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "## STAGE Release Gate: PASSED" >> "$GITHUB_STEP_SUMMARY"