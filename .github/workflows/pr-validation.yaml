name: PR Validation

on:
  pull_request:
    branches:
      - development
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
    gitleaks:
      name: Gitleaks Scan
      runs-on: ubuntu-latest
      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.github/policies/secrets/.gitleaks.toml

      - name: Verify Gitleaks SARIF Report
        shell: bash
        env:
          REPORT_FILE: ${{ github.workspace }}/gitleaks-results.sarif
        run: |
          set -euo pipefail

          if [[ ! -f "$REPORT_FILE" ]]; then
            echo "::error::Gitleaks SARIF report was not generated: $REPORT_FILE"
            exit 1
          fi

          if [[ ! -s "$REPORT_FILE" ]]; then
            echo "::error::Gitleaks SARIF report is empty: $REPORT_FILE"
            exit 1
          fi

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ github.workspace }}/results.sarif
          category: gitleaks

    checkmarx-sast:
      name: Checkmarx SAST
      runs-on: ubuntu-latest
      needs: gitleaks
      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Checkmarx SAST
        id: checkmarx
        uses: ./.github/actions/checkmarx-sast
        env:
          CX_CLIENT_ID: ${{ secrets.CX_CLIENT_ID }}
          CX_CLIENT_SECRET: ${{ secrets.CX_CLIENT_SECRET }}
        with:
          base-uri: ${{ vars.CX_BASE_URI }}
          tenant: ${{ vars.CX_TENANT }}
          source-directory: "."
          sast-threshold: "sast-critical=1;sast-high=1"
          incremental: "false"
          generate-sarif: "true"
          report-directory: ".github/reports"

      - name: Upload Checkmarx SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.checkmarx.outputs.sarif-file }}
          category: checkmarx-sast

    snyk-sca:
      name: Snyk SCA
      runs-on: ubuntu-latest
      needs: gitleaks
      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Snyk CLI
        id: snyk-setup
        uses: snyk/actions/setup@v1
        with:
          snyk-version: "1.1301.0"

      - name: Run Snyk SCA
        id: snyk
        uses: ./.github/actions/snyk-sca
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          working-directory: "."
          organization: ${{ vars.SNYK_ORGANIZATION }}
          severity-threshold: "high"
          generate-sarif: "true"
          generate-json: "true"
          maven-aggregate-project: "false"
          report-directory: ".github/reports"

      - name: Upload Snyk SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.snyk.outputs.sarif-file }}
          category: snyk-sca

      - name: Upload Snyk JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-sca-report
          path: .github/reports/snyk.json
          if-no-files-found: error
          retention-days: 30

    application-verification:
      name: Application Verification
      runs-on: ubuntu-latest
      needs:
      - checkmarx-sast
      - snyk-sca
      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Application Verification
        id: verification
        uses: ./.github/actions/application-verification
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          working-directory: "."
          sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
          maven-goals: "verify"

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ${{ steps.verification.outputs.surefire-report-directory }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload JaCoCo XML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: ${{ steps.verification.outputs.jacoco-xml-report }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload JaCoCo HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html-report
          path: ${{ steps.verification.outputs.jacoco-html-report-directory }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload SonarQube Task Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-task-report
          path: ${{ steps.verification.outputs.sonar-report-task-file }}
          if-no-files-found: error
          retention-days: 1
    