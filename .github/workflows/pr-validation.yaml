name: PR Validation

on:
  pull_request:
    branches:
      - development
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
    gitleaks:
      name: Gitleaks Scan
      runs-on: ubuntu-latest
      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/policies/gitleaks/.gitleaks.toml

      - name: Verify Gitleaks SARIF Report
        shell: bash
        env:
          REPORT_FILE: ${{ github.workspace }}/results.sarif
        run: |
          set -euo pipefail

          if [[ ! -f "$REPORT_FILE" ]]; then
            echo "::error::Gitleaks SARIF report was not generated: $REPORT_FILE"
            exit 1
          fi

          if [[ ! -s "$REPORT_FILE" ]]; then
            echo "::error::Gitleaks SARIF report is empty: $REPORT_FILE"
            exit 1
          fi

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ github.workspace }}/results.sarif
          category: gitleaks

    checkmarx-sast:
      name: Checkmarx SAST
      runs-on: ubuntu-latest
      needs: gitleaks
      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Checkmarx SAST
        id: checkmarx
        uses: ./actions/checkmarx-sast
        env:
          CX_CLIENT_ID: ${{ secrets.CX_CLIENT_ID }}
          CX_CLIENT_SECRET: ${{ secrets.CX_CLIENT_SECRET }}
        with:
          base-uri: ${{ vars.CX_BASE_URI }}
          tenant: ${{ vars.CX_TENANT }}
          source-directory: "."
          sast-threshold: "sast-critical=1;sast-high=1"
          incremental: "false"
          generate-sarif: "true"
          report-directory: ".github/reports"

      - name: Upload Checkmarx SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.checkmarx.outputs.sarif-file }}
          category: checkmarx-sast

    snyk-sca:
      name: Snyk SCA
      runs-on: ubuntu-latest
      needs: gitleaks
      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Snyk CLI
        id: snyk-setup
        uses: snyk/actions/setup@v1
        with:
          snyk-version: "1.1301.0"

      - name: Run Snyk SCA
        id: snyk
        uses: ./actions/snyk-sca
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          working-directory: "."
          organization: ${{ vars.SNYK_ORGANIZATION }}
          severity-threshold: "high"
          generate-sarif: "true"
          generate-json: "true"
          maven-aggregate-project: "false"
          report-directory: ".github/reports"

      - name: Upload Snyk SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.snyk.outputs.sarif-file }}
          category: snyk-sca

      - name: Upload Snyk JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-sca-report
          path: .github/reports/snyk.json
          if-no-files-found: error
          retention-days: 30

    application-verification:
      name: Application Verification
      runs-on: ubuntu-latest
      needs:
      - checkmarx-sast
      - snyk-sca
      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Application Verification
        id: verification
        uses: ./actions/application-verification
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          working-directory: "."
          sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
          maven-goals: "verify"

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ${{ steps.verification.outputs.surefire-report-directory }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload JaCoCo XML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: ${{ steps.verification.outputs.jacoco-xml-report }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload JaCoCo HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html-report
          path: ${{ steps.verification.outputs.jacoco-html-report-directory }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload SonarQube Task Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-task-report
          path: ${{ steps.verification.outputs.sonar-report-task-file }}
          if-no-files-found: error
          retention-days: 1

    sonar-quality-gate:
      name: SonarQube Quality Gate
      runs-on: ubuntu-latest
      needs: application-verification
      steps:
      - name: Download SonarQube Task Report
        uses: actions/download-artifact@v4
        with:
          name: sonar-task-report
          path: sonar-task-report

      - name: Verify SonarQube Task Report
        shell: bash
        env:
          REPORT_FILE: sonar-task-report/report-task.txt
        run: |
          set -euo pipefail

          if [[ ! -f "$REPORT_FILE" ]]; then
            echo "::error::SonarQube report-task.txt was not downloaded: $REPORT_FILE"
            exit 1
          fi

          if [[ ! -s "$REPORT_FILE" ]]; then
            echo "::error::SonarQube report-task.txt is empty: $REPORT_FILE"
            exit 1
          fi

      - name: Check SonarQube Quality Gate
        id: sonarqube-quality-gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.0
        with:
          scanMetadataReportFile: sonar-task-report/report-task.txt
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

    pr-validation-summary:
      name: PR Validation Summary
      runs-on: ubuntu-latest
      if: always()
      needs:
      - gitleaks
      - checkmarx-sast
      - snyk-sca
      - application-verification
      - sonar-quality-gate
      steps:
      - name: Generate PR Validation Summary
        shell: bash
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          CHECKMARX_RESULT: ${{ needs.checkmarx-sast.result }}
          SNYK_RESULT: ${{ needs.snyk-sca.result }}
          APPLICATION_RESULT: ${{ needs.application-verification.result }}
          SONAR_RESULT: ${{ needs.sonar-quality-gate.result }}
        run: |
          set -euo pipefail

          result_icon() {
            case "$1" in
              success)
                echo "✅ Passed"
                ;;
              failure)
                echo "❌ Failed"
                ;;
              cancelled)
                echo "⚠️ Cancelled"
                ;;
              skipped)
                echo "⏭️ Skipped"
                ;;
              *)
                echo "❓ Unknown"
                ;;
            esac
          }

          GITLEAKS_STATUS="$(result_icon "$GITLEAKS_RESULT")"
          CHECKMARX_STATUS="$(result_icon "$CHECKMARX_RESULT")"
          SNYK_STATUS="$(result_icon "$SNYK_RESULT")"
          APPLICATION_STATUS="$(result_icon "$APPLICATION_RESULT")"
          SONAR_STATUS="$(result_icon "$SONAR_RESULT")"

          {
            echo "# PR Validation Summary"
            echo
            echo "| Validation | Result |"
            echo "|---|---|"
            echo "| Gitleaks | ${GITLEAKS_STATUS} |"
            echo "| Checkmarx SAST | ${CHECKMARX_STATUS} |"
            echo "| Snyk SCA | ${SNYK_STATUS} |"
            echo "| Application Verification | ${APPLICATION_STATUS} |"
            echo "| SonarQube Quality Gate | ${SONAR_STATUS} |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$GITLEAKS_RESULT" != "success" ]]; then
            echo "::error::Gitleaks validation did not pass."
            exit 1
          fi

          if [[ "$CHECKMARX_RESULT" != "success" ]]; then
            echo "::error::Checkmarx SAST validation did not pass."
            exit 1
          fi

          if [[ "$SNYK_RESULT" != "success" ]]; then
            echo "::error::Snyk SCA validation did not pass."
            exit 1
          fi

          if [[ "$APPLICATION_RESULT" != "success" ]]; then
            echo "::error::Application verification did not pass."
            exit 1
          fi

          if [[ "$SONAR_RESULT" != "success" ]]; then
            echo "::error::SonarQube Quality Gate did not pass."
            exit 1
          fi

          echo "## Overall Result" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "✅ **PR validation passed.**" >> "$GITHUB_STEP_SUMMARY"
    